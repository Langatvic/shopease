{% extends 'base_admin.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h2>Restock {{ product.name }}</h2>
<p>Current stock: <strong>{{ product.stock }}</strong></p>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button class="btn btn-primary">Update Stock</button>
</form>
{% endblock %}

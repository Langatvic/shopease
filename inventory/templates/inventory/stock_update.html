{% extends 'base_admin.html' %}
{% load crispy_forms_tags %}
{% block title %}Restock {{ product.name }}{% endblock %}
{% block heading %}Restock {{ product.name }}{% endblock %}
{% block content %}
<div class="panel panel-pad" style="max-width: 520px;">
  <p>Current stock: <strong>{{ product.stock }}</strong></p>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2 mt-2">
      <button class="btn btn-primary" type="submit">Update stock</button>
      <a href="{% url 'inventory:stock_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

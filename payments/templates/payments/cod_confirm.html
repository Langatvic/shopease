{% extends 'base.html' %}
{% block title %}Cash on delivery | ShopEase{% endblock %}
{% block content %}
<div class="notice">
  <div class="notice-icon info"><i class="bi bi-cash-coin"></i></div>
  <h1>Cash on delivery selected</h1>
  <p>You chose to pay in cash for order <strong>{{ order.order_number }}</strong>. Have the amount ready when it arrives.</p>
  <a href="{% url 'orders:order_detail' order.order_number %}" class="btn btn-primary mt-3">View order</a>
</div>
{% endblock %}

{% extends 'auth_base.html' %}
{% block title %}Log in | ShopEase{% endblock %}
{% block auth_content %}
<h1>Welcome back</h1>
<p class="sub">Log in to see your cart, your orders and your saved details.</p>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="id_username">Username</label>
    <input type="text" id="id_username" name="username" class="form-control" value="{{ request.POST.username }}" placeholder="Your username" autocomplete="username" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="id_password" name="password" class="form-control" placeholder="Your password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" data-toggle-password="id_password" aria-label="Show password"><i class="bi bi-eye"></i></button>
    </div>
  </div>
  <div class="auth-row"><a href="{% url 'accounts:password_reset' %}">Forgot password?</a></div>
  <button class="btn btn-primary" type="submit">Log in</button>
</form>
<p class="auth-alt">Don't have an account? <a href="{% url 'accounts:register' %}">Sign up</a></p>
{% endblock %}

{% extends 'auth_base.html' %}
{% load crispy_forms_tags %}
{% block title %}Create account | ShopEase{% endblock %}
{% block auth_content %}
<h1>Create your account</h1>
<p class="sub">Check out faster and keep track of every order.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form|crispy }}
  <button class="btn btn-primary mt-2" type="submit">Create account</button>
</form>
<p class="auth-alt">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}

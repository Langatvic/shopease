{% extends 'auth_base.html' %}
{% load crispy_forms_tags %}
{% block title %}Choose a new password | ShopEase{% endblock %}
{% block auth_content %}
<h1>Choose a new password</h1>
<p class="sub">Pick something you haven't used on ShopEase before.</p>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button class="btn btn-primary mt-2" type="submit">Save new password</button>
</form>
{% endblock %}

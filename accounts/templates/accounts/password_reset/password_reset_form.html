{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3>Password Reset</h3>
    <p>Enter your email to receive a reset link.</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-primary" type="submit">Send Link</button>
    </form>
  </div>
</div>
{% endblock %}

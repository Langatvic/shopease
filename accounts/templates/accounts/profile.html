{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h3>My Profile</h3>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-primary" type="submit">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}

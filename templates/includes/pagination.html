{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}"><i class="bi bi-chevron-left"></i> Previous</a>
  {% else %}
    <span class="disabled"><i class="bi bi-chevron-left"></i> Previous</span>
  {% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next <i class="bi bi-chevron-right"></i></a>
  {% else %}
    <span class="disabled">Next <i class="bi bi-chevron-right"></i></span>
  {% endif %}
</nav>
{% endif %}

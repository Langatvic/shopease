{% extends 'base.html' %}
{% block title %}Order received | ShopEase{% endblock %}
{% block content %}
<div class="notice">
  <div class="notice-icon"><i class="bi bi-check-lg"></i></div>
  <h1>Thank you for your order</h1>
  <p>Your order <strong>{{ order.order_number }}</strong> has been received. We will let you know as it moves along.</p>
  <div class="d-flex gap-2 justify-content-center flex-wrap mt-4">
    <a href="{% url 'orders:order_history' %}" class="btn btn-primary">View my orders</a>
    <a href="{% url 'store:product_list' %}" class="btn btn-outline-secondary">Keep shopping</a>
  </div>
</div>
{% endblock %}

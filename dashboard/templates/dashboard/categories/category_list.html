{% extends 'base_admin.html' %}
{% block title %}Categories{% endblock %}
{% block heading %}Categories{% endblock %}
{% block content %}
<div class="panel">
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Category</th><th class="num">Products</th></tr></thead>
      <tbody>
        {% for c in categories %}
        <tr><td><strong>{{ c.name }}</strong></td><td class="num">{{ c.products.count }}</td></tr>
        {% empty %}
        <tr><td colspan="2" class="text-center muted py-5">No categories yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% extends 'base_admin.html' %}
{% block title %}Update status{% endblock %}
{% block heading %}Update status for {{ order.order_number }}{% endblock %}
{% block content %}
<div class="panel panel-pad" style="max-width: 480px;">
  <form method="post">
    {% csrf_token %}
    <label class="form-label" for="status">Order status</label>
    <select id="status" name="status" class="form-select mb-3">
      {% for value, label in order.STATUS_CHOICES %}
        <option value="{{ value }}" {% if order.status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save status</button>
      <a href="{% url 'dashboard:order_detail' order.order_number %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

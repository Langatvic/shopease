{% extends 'base_admin.html' %}
{% block content %}
<h2>Orders</h2>
<table class="table">
  <thead><tr><th>#</th><th>Customer</th><th>Status</th><th>Total</th><th>Date</th><th></th></tr></thead>
  <tbody>
    {% for o in orders %}
    <tr>
      <td>{{ o.order_number }}</td><td>{{ o.user.username }}</td>
      <td><span class="badge bg-info">{{ o.get_status_display }}</span></td>
      <td>${{ o.total_amount }}</td><td>{{ o.created_at|date:"M d, Y" }}</td>
      <td><a href="{% url 'dashboard:order_detail' o.order_number %}" class="btn btn-sm btn-outline-primary">View</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

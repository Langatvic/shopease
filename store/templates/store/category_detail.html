{% extends 'base.html' %}
{% block title %}{{ category.name }}{% endblock %}
{% block content %}
<h2>{{ category.name }}</h2>
<p>{{ category.description }}</p>
<div class="row g-3">
  {% for product in products %}
    <div class="col-sm-6 col-lg-3">{% include 'includes/product_card.html' %}</div>
  {% empty %}
    <p>No products in this category.</p>
  {% endfor %}
</div>
{% endblock %}
